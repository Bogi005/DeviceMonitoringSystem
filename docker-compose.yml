services:
  backend:
    build: ./backend
    image: device-monitoring-backend
    container_name: device-monitoring-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/device_monitoring
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres
  postgres:
    image: postgres:16
    container_name: device-monitoring-postgres
    environment:
      POSTGRES_DB: device_monitoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
